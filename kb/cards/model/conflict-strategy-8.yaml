# 西方/现代博弈模型卡 · 第 2 批：冲突的战略（v2 操作升级）
# 来源：《冲突的战略》(Schelling) —— 二手提炼；v2 未取得原书全文，未逐页核对
# v2 升级：每卡补 example / signals / scripts / failure_modes / 参数默认值 / related
# 字段：id / name / card_type / mechanism / definition / example / signals / scripts / recognize / misjudge / failure_modes / action / params / counter / related / source / ethics / confidence / review_status / v2_status

- id: model-schelling-point
  name: 聚焦点
  card_type: model
  mechanism: {primary: M1, secondary: [M9]}
  definition: 在多重均衡中，双方不约而同选中的那个显眼方案；靠共同知识而非沟通达成协调。
  example: 两个团队约见面没定具体地点，都想到公司楼下那家咖啡店。
  signals: [可选结果有好几个, 双方无法细沟通, 有一个选项明显更「顺理成章」]
  scripts: [「就按老地方/上次的惯例来。」, 「我们都别猜了，选最显眼那个。」]
  recognize: [存在多个都可能的结果, 双方无法事先沟通, 有一方特别显眼]
  misjudge: [以为自己觉得显眼对方也一定觉得, 忽略文化差异]
  failure_modes: [双方选了不同聚焦点, 聚焦点被对方抢先定义, 显眼但不公平]
  action: [找双方共同熟悉的先例或惯例, 主动提出一个显眼方案降低协调成本]
  params: {candidates: 2–5 个, salience: 高}
  counter: [对方抢先定义聚焦点]
  related: [M1 信息, 纳什均衡]
  source: {book: 冲突的战略, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: green
  confidence: medium
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-deterrence
  name: 威慑
  card_type: model
  mechanism: {primary: M6, secondary: [M9]}
  definition: 通过让对方相信「动手的代价大于收益」来阻止对方行动；靠能力与决心两部分。
  example: 主管提前说明越线就取消项目资格，团队不敢踩线。
  signals: [对方在权衡是否越界, 你有报复能力, 对方不确定你的决心]
  scripts: [「红线就这一条，越了按制度走。」, 「我不是吓你，上次已经执行过一次。」]
  recognize: [对方在权衡是否越界, 你有报复能力, 对方不确定你的决心]
  misjudge: [只展示能力不展示决心, 威慑过度刺激对方]
  failure_modes: [红线模糊, 说了不执行, 威慑变成挑衅]
  action: [明确红线与后果, 用可见动作证明会执行, 给对方留退路]
  params: {capability: 中–高, credibility: 中–高}
  counter: [对方试探红线, 或升级到你不愿承受的程度]
  related: [M6 承诺, 可信威胁]
  source: {book: 冲突的战略, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: gray
  confidence: high
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-credible-threat
  name: 可信威胁
  card_type: model
  mechanism: {primary: M6, secondary: [M9]}
  definition: 只有对方相信你真会执行的威胁才有效；可信度来自能力、决心与自缚手脚。
  example: 合同约定逾期自动扣款，不需要再吵，系统会执行。
  signals: [你发出威胁但对方不理会, 执行威胁对你自己也有代价]
  scripts: [「条款写死了，逾期自动扣。」, 「触发条件一到，我也没有裁量权。」]
  recognize: [你发出威胁但对方不理会, 执行威胁对你自己也有代价]
  misjudge: [把狠话当威胁, 忽略自己执行时也痛]
  failure_modes: [威胁不可执行, 执行成本高到自己先退, 触发条件模糊]
  action: [把威胁与自动触发机制绑定, 只威胁自己真会做的事, 让对方看见触发条件]
  params: {cost_to_execute: 中, visibility: 高}
  counter: [对方测试你是否真会执行]
  related: [M6 承诺, 人质与绑定]
  source: {book: 冲突的战略, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: gray
  confidence: high
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-retaliation-ladder
  name: 报复与升级阶梯
  card_type: model
  mechanism: {primary: M9, secondary: [M6]}
  definition: 冲突按阶梯逐级升级，每一级都是信号与代价的交换；控制阶梯比赢下每一级更重要。
  example: 对方抢客户，你先发警告函，再按合同追责，而不是直接撕破脸。
  signals: [双方在互相加码, 每次回应都比上次重, 存在失控风险]
  scripts: [「这次口头警告，下次按合同追责。」, 「我们停在第三级，别再往上。」]
  recognize: [双方在互相加码, 每次回应都比上次重, 存在失控风险]
  misjudge: [情绪化跳级, 没有下台阶机制]
  failure_modes: [跳级导致失控, 只升不降, 没有停点]
  action: [先定阶梯与停点, 每次回应对等且留沟通口, 设安全阀]
  params: {steps: 3–5 级, threshold: 中}
  counter: [对方跳级或误判你的信号]
  related: [M9 信号, 边缘政策]
  source: {book: 冲突的战略, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: gray
  confidence: medium
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-limited-conflict
  name: 冲突控制与有限冲突
  card_type: model
  mechanism: {primary: M11, secondary: [M12]}
  definition: 把冲突限制在可控范围，避免全面对抗；目标是管理代价而非彻底消灭对方。
  example: 两个部门争执只放在预算会上，不扩大到人事和私下关系。
  signals: [全面开战成本过高, 双方都有不想失去的东西]
  scripts: [「这次只谈预算，其他不动。」, 「争归争，别把事闹到老板那里。」]
  recognize: [全面开战成本过高, 双方都有不想失去的东西]
  misjudge: [把克制当软弱, 忽略对方也在控制]
  failure_modes: [范围失控, 对方扩大战场, 克制被误读]
  action: [明确不打击的范围, 用有限动作传递信号, 保留降级通道]
  params: {scope: 小–中, cost_cap: 中}
  counter: [对方扩大冲突范围逼你跟进]
  related: [M11 资源, M12 叙事]
  source: {book: 冲突的战略, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: green
  confidence: medium
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-arms-race
  name: 军备竞赛
  card_type: model
  mechanism: {primary: M11, secondary: [M9]}
  definition: 双方为不落后而持续加码，结果双方成本上升、安全未必增加。
  example: 两家公司互相补贴抢市场，用户没多多少，利润都下滑。
  signals: [对方加码你就必须跟, 投入越来越多但优势没变]
  scripts: [「再补贴下去都亏，我们换个维度比。」, 「这个竞赛我们停，改比服务。」]
  recognize: [对方加码你就必须跟, 投入越来越多但优势没变]
  misjudge: [以为加码能逼退对方, 忽略双方都被拖住]
  failure_modes: [被拖垮, 无法单方面退出, 投入沉没]
  action: [算清加码的边际收益, 寻找限制竞赛的规则或协议, 把资源转向对方不比的维度]
  params: {cost: 高, parity: 对等}
  counter: [对方把竞赛引到你成本更高的领域]
  related: [M11 资源, 消耗战]
  source: {book: 冲突的战略, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: green
  confidence: medium
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-hostage
  name: 人质与绑定
  card_type: model
  mechanism: {primary: M6, secondary: [M9]}
  definition: 把自己与某个不可逆的后果绑定，让对方不敢轻举妄动；本质是自缚以取信。
  example: 公开说「项目黄了我辞职」，把个人信誉绑上去。
  signals: [你需要让对方相信你会两败俱伤, 对方在试探你的底线]
  scripts: [「项目黄了我走人，所以我拼到底。」, 「我已经把自己押上了。」]
  recognize: [你需要让对方相信你会两败俱伤, 对方在试探你的底线]
  misjudge: [绑定过度导致没有退路, 绑定的东西对方不在乎]
  failure_modes: [绑定物对方不疼, 自我绑架, 无法解绑]
  action: [选择对方真正在乎的绑定物, 公开绑定提高可信度, 保留解绑条件]
  params: {stake: 高, reversibility: 低}
  counter: [对方测试你是否真敢同归于尽]
  related: [M6 承诺, 可信威胁]
  source: {book: 冲突的战略, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: gray
  confidence: medium
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-bargaining-commitment
  name: 谈判中的承诺
  card_type: model
  mechanism: {primary: M6, secondary: [M5]}
  definition: 在谈判中公开锁定底线或立场，压缩自己的让步空间，从而改变对方预期。
  example: 卖方公开说「低于 500 不卖」，买家不再往下压。
  signals: [对方不断压价, 你需要让对方相信不能再让]
  scripts: [「低于这个数我不签，谁来都一样。」, 「这条已经公开，我改不了。」]
  recognize: [对方不断压价, 你需要让对方相信不能再让]
  misjudge: [承诺太死导致谈崩, 承诺不可信等于没承诺]
  failure_modes: [锁定后无法收场, 被对方测试, 承诺与利益不符]
  action: [公开底线并说明理由, 让承诺有第三方见证, 留一个非核心的让步空间]
  params: {credibility: 中–高, flexibility: 低}
  counter: [对方也锁定立场形成僵局]
  related: [M6 承诺, 讨价还价]
  source: {book: 冲突的战略, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: green
  confidence: high
  review_status: reviewed-v1
  v2_status: operational-v2
