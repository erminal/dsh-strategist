  v2_status: operational-v2

- id: model-tit-for-tat
  name: 以牙还牙
  card_type: model
  mechanism: {primary: M6, secondary: [M9]}
  definition: 第一轮合作，之后照对方上一轮的做法回应；简单、可预测、能建立合作。
  example: 同事第一次配合你，你全力配合；他甩锅一次，你下次保留。
  signals: [重复互动, 对方在试探底线]
  scripts: [「这次我先配合你，下次看你。」, 「你怎么对我，我怎么对你。」]
  recognize: [重复互动需要规则, 对方试探]
  misjudge: [在噪音环境互相报复, 对一次性对手使用]
  failure_modes: [误解引发报复循环, 无原则宽容, 对一次性对手失效]
  action: [先释放合作信号, 背叛时对等回应, 对方回头就恢复]
  params: {forgiveness: 1 次, retaliation: 对等}
  counter: [对方制造误判引发报复]
  related: [M6 承诺, 宽容]
  source: {book: 策略思维, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: green
  confidence: high
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-reputation
  name: 声誉
  card_type: model
  mechanism: {primary: M9, secondary: [M6]}
  definition: 过去行为形成的预期，会影响对方未来如何对待你；声誉是长期资产。
  example: 你在行业里以「说话算数」出名，谈合作时对方更愿意先让步。
  signals: [还要在同一圈子混, 对方在观察你如何对待别人]
  scripts: [「这个圈子里我还要做人，不会为这点钱砸招牌。」, 「我说到做到，你可以去问。」]
  recognize: [还要在同一圈子/市场, 对方在观察]
  misjudge: [为小利毁长期声誉, 把人设当声誉]
  failure_modes: [人设崩塌, 一次失信被放大, 圈子太小传得快]
  action: [明确想建立的声誉类型, 用可观察行为兑现, 及时纠正破坏行为]
  params: {visibility: 高, consistency: 高}
  counter: [对方散布负面信息]
  related: [M9 信号, 重复博弈]
  source: {book: 策略思维, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: green
  confidence: medium
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-bargaining
  name: 讨价还价
  card_type: model
  mechanism: {primary: M5, secondary: [M2]}
  definition: 双方就分配进行谈判，结果取决于底线、耐心、替代方案与承诺能力。
  example: 房东开价 6000，你查到同小区 5200，最后 5400 成交。
  signals: [存在可分配利益, 双方都有替代方案, 在同一个数字上拉锯]
  scripts: [「同小区同户型最近成交在 5200–5400。」, 「如果今天定，我能接受 5400。」]
  recognize: [存在可分配利益, 双方都有替代方案]
  misjudge: [只谈价格不谈多议题, 暴露底线]
  failure_modes: [先亮底线, 让步过快, 没有BATNA]
  action: [先算双方 BATNA, 多议题打包, 条件式让步]
  params: {batna: 强/弱, patience: 高/低}
  counter: [对方用最后通牒或拖延]
  related: [M5 交换, BATNA]
  source: {book: 策略思维, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: green
  confidence: high
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-auction
  name: 拍卖与赢家诅咒
  card_type: model
  mechanism: {primary: M5, secondary: [M1]}
  definition: 竞价机制下，出价最高者中标；在共同价值拍卖中，赢家常因高估而亏损（赢家诅咒）。
  example: 抢项目时越报越低，中标后发现成本兜不住。
  signals: [多人竞价, 价值不确定, 出价最高者最乐观]
  scripts: [「先算成本上限，超过就走。」, 「别人报价里可能包含我不知道的信息。」]
  recognize: [多人竞价/价值不确定, 最高出价者最乐观]
  misjudge: [把中标当成功, 忽略他人报价信息]
  failure_modes: [赢家诅咒, 情绪抬价, 成本估算错误]
  action: [先独立估值再参考他人, 设最高出价严格执行, 优先信息优势标的]
  params: {value_range: 宽, bidders: 3+}
  counter: [对方抬价或设局]
  related: [M5 交换, 逆向选择]
  source: {book: 策略思维, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: green
  confidence: medium
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-mechanism-design
  name: 激励设计（机制设计）
  card_type: model
  mechanism: {primary: M5, secondary: [M3]}
  definition: 先设计规则与激励，让对方在自利驱动下做出你想要的行为；规则比说服更可靠。
  example: 团队按「客户续约率」而不是「签单额」发奖金，大家开始重视售后。
  signals: [需要影响一群人, 靠号召/道德约束效果差]
  scripts: [「我们把考核改成续约率，大家自然会把售后做好。」, 「说真话的人不吃亏，规则就这么定。」]
  recognize: [要影响一群人, 号召效果差]
  misjudge: [只设目标不设激励, 激励与目标错位]
  failure_modes: [指标造假, 规则被钻空子, 激励成本过高]
  action: [明确目标行为与可观测指标, 让说真话/好好干成为最优, 预留防钻空子校验]
  params: {incentive: 中, penalty: 低–中, observability: 高}
  counter: [对方钻空子或合谋]
  related: [M5 交换, 委托代理]
  source: {book: 策略思维, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: green
  confidence: medium
  review_status: reviewed-v1
  v2_status: operational-v2
