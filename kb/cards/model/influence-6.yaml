# 西方/现代博弈模型卡 · 第 6 批：影响力（v2 操作升级，全部 gray）
# 来源：《影响力》(Cialdini) —— 二手提炼；v2 未取得原书全文，未逐页核对
# 伦理说明：本批全部标 gray；只用于「正当说服」与「识别防御」，不得用于操控、欺诈、利用脆弱性。
# v2 升级：每卡补 example / signals / scripts / defense / failure_modes / 参数默认值 / related
# 字段：id / name / card_type / mechanism / definition / example / signals / scripts / defense / recognize / misjudge / failure_modes / action / params / counter / related / source / ethics / confidence / review_status / v2_status

- id: model-reciprocity-principle
  name: 互惠原则
  card_type: model
  mechanism: {primary: M6, secondary: [M5]}
  definition: 接受别人的好处后会产生回报压力；先给后取是常见说服路径。
  example: 商家先送小样，再让你买正装；你不好意思白拿。
  signals: [对方先给好处, 你感到不好意思拒绝]
  scripts: [「我先帮你一次，不用急着回报。」, 「这次我请，下次你看着办。」]
  defense: [先问「我是不是因为收了东西才答应」, 免费样品可以收但不必答应, 把回报与请求分开]
  recognize: [对方先给好处, 你感到不好意思拒绝]
  misjudge: [把人情当义务, 被小恩小惠套住]
  failure_modes: [只给不取被当冤大头, 给太多让人警惕, 回报失衡]
  action: [正当场景先提供价值, 识别「先给后要」的套路, 回报要有限度]
  params: {gift_value: 小–中, obligation: 中}
  counter: [对方用超额好处绑架你]
  related: [M6 承诺, 互惠（策略）]
  source: {book: 影响力, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: gray
  confidence: high
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-commitment-consistency
  name: 承诺一致
  card_type: model
  mechanism: {primary: M6, secondary: [M12]}
  definition: 人倾向让后续行为与先前公开承诺保持一致；小承诺会推大承诺。
  example: 先让你答应「帮忙看一下」，再变成「那你顺便做了吧」。
  signals: [对方先让你做小承诺, 你被要求继续加码]
  scripts: [「你之前说重视质量，这次也按质量来？」, 「公开说过的，我认。」]
  defense: [答应前先想「后面会不会被加码」, 允许自己说「当时情况不同」, 小承诺也要留边界]
  recognize: [对方先让你做小承诺, 你被要求继续加码]
  misjudge: [为面子硬撑错误决定, 被小步套牢]
  failure_modes: [登门槛被套, 为面子不回头, 承诺与利益冲突]
  action: [公开承诺前先想清, 识别「登门槛」套路, 允许自己纠正]
  params: {commitment_size: 小→大, visibility: 中–高}
  counter: [对方用你过去的表态逼你继续]
  related: [M6 承诺, 承诺与可信威胁]
  source: {book: 影响力, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: gray
  confidence: high
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-social-proof
  name: 社会认同
  card_type: model
  mechanism: {primary: M12, secondary: [M5]}
  definition: 不确定时，人会参考多数人的行为；「大家都这样」会降低判断门槛。
  example: 直播间刷屏「都在买」，你也跟着下单。
  signals: [你不确定该怎么做, 对方强调很多人都选了这个]
  scripts: [「这是真实用户的反馈。」, 「你可以自己去看评价，不急着定。」]
  defense: [问「样本是谁、数据能核吗」, 区分「多数」与「正确」, 找独立评价]
  recognize: [你不确定该怎么做, 对方强调很多人都选了这个]
  misjudge: [把从众当正确, 忽略样本被操纵]
  failure_modes: [伪造口碑, 样本偏差, 从众踩坑]
  action: [看数据来源是否真实, 在正当场景用真实案例, 识别伪造口碑]
  params: {sample: 大, similarity: 高}
  counter: [对方伪造多数意见]
  related: [M12 框架, 权威]
  source: {book: 影响力, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: gray
  confidence: medium
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-authority-principle
  name: 权威
  card_type: model
  mechanism: {primary: M9, secondary: [M12]}
  definition: 人倾向服从权威符号（头衔、制服、资历）；真假权威都有效。
  example: 穿白大褂的人推荐保健品，看起来更可信。
  signals: [对方用头衔/资历压你, 你不确定对方是否真懂]
  scripts: [「这是我的资质证明。」, 「你可以核实我的背景。」]
  defense: [问「头衔之外他懂不懂」, 查利益关系, 区分权威与专家]
  recognize: [对方用头衔/资历压你, 你不确定对方是否真懂]
  misjudge: [把头衔当专业, 忽略利益立场]
  failure_modes: [假权威, 权威越界, 盲从]
  action: [核实权威的真实性, 在正当场景展示资质, 识别假权威]
  params: {authority_type: 头衔/资历, legitimacy: 中–高}
  counter: [对方冒充权威]
  related: [M9 信号, 社会认同]
  source: {book: 影响力, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: gray
  confidence: medium
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-liking
  name: 喜好
  card_type: model
  mechanism: {primary: M9, secondary: [M12]}
  definition: 人更容易答应自己喜欢或相似的人；好感会被外貌、相似性、赞美、合作放大。
  example: 先聊共同爱好拉近关系，再提请求。
  signals: [对方刻意拉近关系, 你对某人莫名有好感]
  scripts: [「我们合作过，信得过。」, 「这事我只找你。」]
  defense: [把关系与交易分开, 问「我喜欢他，条款就合理吗」, 找第三方核价]
  recognize: [对方刻意拉近关系, 你对某人莫名有好感]
  misjudge: [把好感当可信, 因喜欢而忽略条款]
  failure_modes: [因喜欢让步, 被讨好套住, 关系绑架]
  action: [把关系与交易分开, 在正当场景建立真实好感, 识别刻意讨好]
  params: {similarity: 高, rapport: 中–高}
  counter: [对方用讨好套取让步]
  related: [M9 信号, 社会认同]
  source: {book: 影响力, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: gray
  confidence: medium
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-scarcity
  name: 稀缺
  card_type: model
  mechanism: {primary: M5, secondary: [M12]}
  definition: 越稀缺越显得有价值；限时、限量、独占会提高紧迫感与渴望。
  example: 「最后 3 个名额，今天截止」。
  signals: [对方强调最后机会/限量, 你感到怕错过]
  scripts: [「名额确实有限，你先确认需求。」, 「不着急，错过这波还有下一波。」]
  defense: [问「我本来就需要吗」, 算「错过真会怎样」, 警惕倒计时]
  recognize: [对方强调最后机会/限量, 你感到怕错过]
  misjudge: [因怕错过而高估价值, 忽略真实需求]
  failure_modes: [伪造稀缺, 冲动下单, 买完后悔]
  action: [先判断是否真需要, 用真实稀缺推动正当决策, 识别伪造紧迫]
  params: {scarcity: 中–高, deadline: 短}
  counter: [对方伪造稀缺与倒计时]
  related: [M5 交换, 损失厌恶]
  source: {book: 影响力, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: gray
  confidence: medium
  review_status: reviewed-v1
  v2_status: operational-v2
