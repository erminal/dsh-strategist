# 西方/现代博弈模型卡 · 第 7 批：组织政治（v2 操作升级）
# 来源：《组织政治》(Mintzberg) —— 二手提炼；v2 未取得原书全文，未逐页核对
# 说明：描述性框架，不是行动许可；涉及灰色手段需提示伦理与法律边界。
# v2 升级：每卡补 example / signals / scripts / defense（灰色卡）/ failure_modes / 参数默认值 / related
# 字段：id / name / card_type / mechanism / definition / example / signals / scripts / defense / recognize / misjudge / failure_modes / action / params / counter / related / source / ethics / confidence / review_status / v2_status

- id: model-coalition
  name: 联盟
  card_type: model
  mechanism: {primary: M3, secondary: [M6]}
  definition: 多方为共同目标临时联合，改变力量对比；联盟靠利益交集维持。
  example: 两个部门联合反对预算削减，逼管理层重新分配。
  signals: [单打独斗力量不足, 有共同对手或共同利益]
  scripts: [「我们先对齐诉求，再一起去谈。」, 「联盟要写清共同目标和分工。」]
  defense: [「这个联盟的共同利益是什么？我会不会被当筹码？」, 「联盟有没有退出条款？」]
  recognize: [单打独斗力量不足, 有共同对手或共同利益]
  misjudge: [以为联盟永久, 忽略利益变化]
  failure_modes: [联盟松散, 被对方收编, 利益分歧散伙]
  action: [找共同利益点, 明确分工与回报, 定期维护]
  params: {members: 3–5 方, alignment: 中}
  counter: [对方拆联盟或收编你的盟友]
  related: [M3 联盟, M6 承诺]
  source: {book: 组织政治, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: gray
  confidence: medium
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-resource-dependence
  name: 资源依赖
  card_type: model
  mechanism: {primary: M3, secondary: [M11]}
  definition: 谁掌握你需要的资源，谁对你有权力；降低依赖就能提升自主性。
  example: 你离不开某个供应商，对方涨价你只能接受。
  signals: [你离不开对方, 对方可以卡你资源]
  scripts: [「我们找第二家备选。」, 「把单点依赖降下来。」]
  defense: [「对方是不是故意制造稀缺？」, 「我的替代方案是什么？」]
  recognize: [你离不开对方, 对方可以卡你资源]
  misjudge: [把依赖当忠诚, 忽略替代方案]
  failure_modes: [被卡脖子, 替代成本高, 关系绑定]
  action: [找替代资源, 降低单点依赖, 增加自己的不可替代性]
  params: {dependence: 高, alternatives: 1–2 个}
  counter: [对方故意制造稀缺]
  related: [M3 联盟, M11 资源]
  source: {book: 组织政治, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: green
  confidence: high
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-information-control
  name: 信息控制
  card_type: model
  mechanism: {primary: M1, secondary: [M12]}
  definition: 控制信息的生产、筛选与解释，就能影响他人判断；信息是组织权力来源。
  example: 领导只给你看筛选后的数据，你误判了项目风险。
  signals: [关键信息只经少数人之手, 你被信息隔离]
  scripts: [「我再看一份原始数据。」, 「这个结论，多方核对一下。」]
  defense: [「他只给我看这一面吗？」, 「还有别的信息渠道吗？」]
  recognize: [关键信息只经少数人之手, 你被信息隔离]
  misjudge: [以为信息自然流通, 忽略过滤与延迟]
  failure_modes: [被喂养片面信息, 决策误判, 失去话语权]
  action: [建立多源信息渠道, 关键信息留痕, 主动核对]
  params: {channels: 2–3 个, transparency: 低}
  counter: [对方封锁或喂养假信息]
  related: [M1 信息, M12 框架]
  source: {book: 组织政治, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: gray
  confidence: medium
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-agenda-setting
  name: 议程设置
  card_type: model
  mechanism: {primary: M12, secondary: [M1]}
  definition: 决定讨论什么、按什么顺序讨论，比在讨论中赢更重要。
  example: 会议议题被少数人定，你的问题总排不上。
  signals: [会议议题由少数人定, 你的问题总排不上]
  scripts: [「我提前把议题发出来。」, 「这个问题老板关心，建议排前面。」]
  defense: [「这个议程是谁定的？」, 「我的议题被排除了吗？」]
  recognize: [会议议题由少数人定, 你的问题总排不上]
  misjudge: [只在既定议程里争, 忽略改议程]
  failure_modes: [议题被压, 排序不利, 时间被耗光]
  action: [提前提交议题, 争取排序权, 把议题包装成对方关心的问题]
  params: {agenda: 5–8 项, order: 前 3 项}
  counter: [对方拖堂或塞入无关议题]
  related: [M12 框架, 信息控制]
  source: {book: 组织政治, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: gray
  confidence: medium
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-legitimacy
  name: 合法性
  card_type: model
  mechanism: {primary: M12, secondary: [M9]}
  definition: 让行为看起来符合规则、惯例与共同价值；合法性降低阻力。
  example: 你的方案被质疑「凭什么」，你拿出制度依据和流程记录。
  signals: [你的方案被质疑凭什么, 需要正当理由]
  scripts: [「这是制度依据。」, 「我们走正式流程，记录都在。」]
  defense: [「程序合规吗？」, 「依据是不是事后找的？」]
  recognize: [你的方案被质疑凭什么, 需要正当理由]
  misjudge: [以为有理就行, 忽略程序与形式]
  failure_modes: [程序瑕疵, 依据不足, 被质疑动机]
  action: [找制度依据, 走正式程序, 借共同价值包装]
  params: {basis: 制度/惯例, procedure: 高}
  counter: [对方质疑程序或动机]
  related: [M12 框架, M9 信号]
  source: {book: 组织政治, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: green
  confidence: medium
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-cooptation
  name: 吸纳与收编
  card_type: model
  mechanism: {primary: M3, secondary: [M7]}
  definition: 把潜在反对者拉进决策圈，用参与感和利益换取支持；也可能被反噬。
  example: 把最强硬的反对者拉进项目组，给他一个位置。
  signals: [有强势反对者, 直接对抗成本高]
  scripts: [「给你一个位置，但规则先定。」, 「授权边界写清楚。」]
  defense: [「给我的是名义还是实权？」, 「规则谁定，能不能改？」]
  recognize: [有强势反对者, 直接对抗成本高]
  misjudge: [把收编当收买, 忽略对方改规则]
  failure_modes: [反客为主, 被架空, 规则被改]
  action: [给名义与实权边界, 明确规则, 保留否决权]
  params: {inclusion: 中, authority: 低}
  counter: [被收编者反客为主]
  related: [M3 联盟, M7 分化]
  source: {book: 组织政治, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: gray
  confidence: low
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-org-bargaining
  name: 组织内谈判
  card_type: model
  mechanism: {primary: M5, secondary: [M2]}
  definition: 组织内的资源、预算、晋升都是谈判；筹码来自依赖、信息与替代方案。
  example: 跨部门要预算，你拿「下季度帮他们做项目」换支持。
  signals: [需要跨部门资源, 有利益冲突]
  scripts: [「我拿什么换？」, 「先算筹码，再上桌。」]
  defense: [「对方用层级压你时，你有替代资源吗？」, 「这是谈判还是通知？」]
  recognize: [需要跨部门资源, 有利益冲突]
  misjudge: [只讲道理不讲筹码, 忽略长期关系]
  failure_modes: [筹码不足, 被层级压, 关系透支]
  action: [先算筹码, 用交换换支持, 留长期合作余地]
  params: {leverage: 中, issue: 1–3 个}
  counter: [对方用层级压你]
  related: [M5 交换, 资源依赖]
  source: {book: 组织政治, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: green
  confidence: medium
  review_status: reviewed-v1
  v2_status: operational-v2

- id: model-resistance
  name: 抵抗与异议
  card_type: model
  mechanism: {primary: M8, secondary: [M9]}
  definition: 弱势方用拖延、消极执行、公开异议等方式抵抗；抵抗是信号，不是终点。
  example: 团队表面同意，实际拖着不做。
  signals: [对方表面同意实际拖延, 出现消极抵抗]
  scripts: [「先听听顾虑是什么。」, 「有意见摆到桌面上，我们一起改。」]
  defense: [「抵抗是利益问题还是情绪问题？」, 「我是不是逼得太紧？」]
  recognize: [对方表面同意实际拖延, 出现消极抵抗]
  misjudge: [把抵抗当背叛, 高压处理]
  failure_modes: [抵抗升级, 表面服从, 关系破裂]
  action: [区分利益抵抗与情绪抵抗, 给表达渠道, 用交换化解]
  params: {intensity: 中, channel: 中}
  counter: [对方把异议升级为公开冲突]
  related: [M8 退出, M9 信号]
  source: {book: 组织政治, chapter: 概念条目（章节待核）, source_type: 二手提炼, verified: false}
  ethics: green
  confidence: medium
  review_status: reviewed-v1
  v2_status: operational-v2
